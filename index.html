<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#12101b">
  <title>SnapCalorie</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app">
    <header class="top-card">
      <p class="label">Calories remaining</p>
      <h1 id="remainingCalories">0</h1>
      <div class="goal-row">
        <label for="dailyGoal">Daily goal</label>
        <input id="dailyGoal" type="number" min="1" step="1" inputmode="numeric" aria-label="Daily calorie goal">
      </div>
    </header>

    <section class="camera-card">
      <h2>Snap your meal</h2>
      <p class="muted">Camera-first logging for quick phone testing.</p>
      <div class="camera-stage">
        <video id="cameraFeed" playsinline autoplay muted></video>
        <img id="capturePreview" alt="Captured meal preview" hidden>
      </div>
      <canvas id="captureCanvas" hidden></canvas>
      <div class="button-row">
        <button id="startCameraBtn" class="btn">Start camera</button>
        <button id="captureBtn" class="btn">Snap</button>
      </div>
      <form id="snapMealForm" class="meal-form">
        <input id="snapMealName" type="text" maxlength="40" placeholder="Meal name" required>
        <input id="snapCalories" type="number" min="1" step="1" inputmode="numeric" placeholder="Calories" required>
        <button type="submit" class="btn primary">Add snapped meal</button>
      </form>
      <p class="muted tiny">AI food recognition is not included yet and will be added later.</p>
    </section>

    <section class="manual-card">
      <h2>Forgot to snap?</h2>
      <form id="manualMealForm" class="meal-form">
        <input id="manualMealName" type="text" maxlength="40" placeholder="Meal name" required>
        <input id="manualCalories" type="number" min="1" step="1" inputmode="numeric" placeholder="Calories" required>
        <button id="manualSubmitBtn" type="submit" class="btn primary">Add manual meal</button>
      </form>
      <button id="openHistoryBtn" class="btn ghost" type="button">Swipe up memories</button>
    </section>
  </main>

  <aside id="historySheet" class="history-sheet" aria-label="Meal memories and history">
    <div id="sheetHandle" class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-header">
      <h2>Memories</h2>
      <button id="closeHistoryBtn" class="btn ghost small" type="button">Close</button>
    </div>
    <ul id="mealHistory" class="history-list"></ul>
  </aside>

  <button id="installBtn" class="install-btn" type="button" hidden>Install app</button>

  <script src="/app.js"></script>
</body>
</html>
