<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driving License Slot Finder</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <h1>🚗 Slot Finder</h1>
        
        <div class="status" id="status">
            <p id="statusText">Not monitoring</p>
            <span id="statusIndicator" class="indicator inactive"></span>
        </div>

        <div class="settings">
            <h2>Settings</h2>
            
            <div class="form-group">
                <label for="refNumber">DVLA Reference Number:</label>
                <input type="text" id="refNumber" placeholder="e.g., 123456">
            </div>

            <div class="form-group">
                <label for="checkCode">Check Code:</label>
                <input type="password" id="checkCode" placeholder="Your check code">
            </div>

            <div class="form-group">
                <label for="testCentres">Test Centres (comma-separated):</label>
                <textarea id="testCentres" placeholder="e.g., London, Manchester, Birmingham" rows="3"></textarea>
            </div>

            <div class="form-group">
                <label for="dateRange">Preferred Date Range (Days):</label>
                <input type="number" id="dateRange" min="1" max="90" value="30" placeholder="30">
            </div>

            <div class="form-group">
                <label for="refreshInterval">Refresh Interval (minutes):</label>
                <input type="number" id="refreshInterval" min="1" max="60" value="5" placeholder="5">
            </div>

            <div class="button-group">
                <button id="startBtn" class="btn btn-primary">Start Monitoring</button>
                <button id="stopBtn" class="btn btn-secondary" disabled>Stop Monitoring</button>
                <button id="saveBtn" class="btn btn-success">Save Settings</button>
            </div>
        </div>

        <div class="logs">
            <h2>Activity Log</h2>
            <div id="logContainer" class="log-container">
                <p class="log-entry">Ready to monitor...</p>
            </div>
            <button id="clearLogsBtn" class="btn btn-small">Clear Logs</button>
        </div>

        <div class="found-slots">
            <h2>Available Slots Found 🎉</h2>
            <div id="slotsContainer" class="slots-container">
                <p>No slots found yet</p>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
